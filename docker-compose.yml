version: '3.9'
services:
  app:
    build: .
    container_name: evkit-app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: production
      APP_KEY: base64:GENERATE_ME
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: evkit
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      - db
  db:
    image: mysql:8.0
    container_name: evkit-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: evkit
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3306:3306"
volumes:
  dbdata: